# Nginx: letakkan dalam /etc/nginx/conf.d/mathquest.conf. Sijil: certbot --nginx -d mathquest.sekolah.edu.my
limit_req_zone $binary_remote_addr zone=mq_login:10m rate=30r/m;

server {
    listen 80;
    server_name mathquest.sekolah.edu.my;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mathquest.sekolah.edu.my;
    ssl_certificate     /etc/letsencrypt/live/mathquest.sekolah.edu.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mathquest.sekolah.edu.my/privkey.pem;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/auth/login {
        limit_req zone=mq_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for menambah IP klien di hujung kanan; aplikasi membaca entri itu apabila TRUST_PROXY=1
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Aplikasi: TRUST_PROXY=1 dan SECURE_COOKIES=true
